name: Salesforce CDC smoke test

on:
  workflow_dispatch:
    inputs:
      listen_seconds:
        description: "Listening window in seconds (10-240)"
        required: true
        default: "90"
        type: choice
        options: ["30", "90", "180", "240"]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: salesforce-cdc-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install "simple-salesforce>=1.12,<2" "requests>=2.31,<3"
      - name: Run read-only CDC test
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
          SF_DOMAIN: ${{ secrets.SF_DOMAIN }}
        run: python cdc_test/smoke_test.py --seconds "${{ inputs.listen_seconds }}"
