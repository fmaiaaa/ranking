name: Salesforce CDC event reception
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: SALESFORCE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "simple-salesforce>=1.12,<2" "requests>=2.31,<3"
      - name: Listen for CDC events for 90 seconds
        env:
          SALESFORCE_USER: ${{ secrets.SALESFORCE_USER }}
          SALESFORCE_PASSWORD: ${{ secrets.SALESFORCE_PASSWORD }}
          SALESFORCE_TOKEN: ${{ secrets.SALESFORCE_TOKEN }}
          SALESFORCE_DOMAIN: ${{ vars.SALESFORCE_DOMAIN || 'login' }}
        run: python cdc_test/listen.py
